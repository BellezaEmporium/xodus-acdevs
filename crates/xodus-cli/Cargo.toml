[package]
name = "xodus-cli"
version = "0.1.0"
edition = "2024"
default-run = "xodus-cli"

[dependencies]
xodus = { path = "../xodus" }
msixvc = { path = "../msixvc" }
eappx = { git = "https://github.com/BellezaEmporium/eappx-rs", rev = "6bd1e37856eff2c267dfce17b5c9696018b1328c" }
base64 = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
console-subscriber = { workspace = true, optional = true }
tao = "0.37.1"
wry = "0.57.0"
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.151"
chrono = { workspace = true }
inquire = "0.9.4"
futures-util = "0.3.34"
uuid = "1.27.0"
indicatif = "0.18.6"
fs2 = "0.4.3"
tempfile = "3.27.0"
rustix = "1.1.5"
ctrlc = "3.5.2"
nix = "0.31.3"

[features]
tokio_console = ["dep:console-subscriber"]
