[package]
name = "xodus"
version = "0.1.0"
edition = "2024"
rust-version = { workspace = true }

[dependencies]
xal = { git = "https://github.com/BellezaEmporium/xal-rs", rev = "1439899c77e6466a808e79d11d852fb38f0690b7" }
tokio = { workspace = true }
reqwest = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
serde_json = "1.0.151"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
rand = "0.10.3"
aes = "0.9.3"
keyring-core = { version = "1.0.0", features = ["sample"] }
zerocopy = { version = "0.8.62", features = ["derive"] }
bergshamra-c14n = "0.9.2"
hmac = "0.13.0"
bergshamra = "0.9.2"
rsa = { version = "0.9.10", features = ["serde", "sha2"] }
sha2 = "0.11.0"
cbc = "0.2.1"
url = "2.5.8"
aes-keywrap = "0.9.1"
num_enum = "0.7.6"
prost = "0.14.4"
globset = "0.4.20"
num-bigint = "0.5.1"
num-integer = "0.1.47"
kryptering = "0.6.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
smbios-lib = "0.9.4"

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-openssl"]}

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"]}

[dev-dependencies]
rsa = "0.9.10"
bergshamra = "0.9.2"
ed25519-dalek = "3.0.0"

[build-dependencies]
prost-build = "0.14.4"

[features]
key-chain-file = []
