[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
rust-version = "1.98.0"

[workspace.dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full", "tracing"] }
uuid = "1.28.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console-subscriber = "0.5"

[patch.crates-io]
ntfs = { git = "https://github.com/bellezaemporium/ntfs", branch = "master" }